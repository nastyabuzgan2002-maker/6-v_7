<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Музей закономерностей</title>

<style>
body{
    font-family: Arial;
    background:#eef3ff;
    text-align:center;
    padding:20px;
}

.card{
    background:white;
    width:900px;
    max-width:95%;
    margin:auto;
    padding:25px;
    border-radius:12px;
    box-shadow:0 0 10px rgba(0,0,0,0.1);
}

.info{
    background:#f8f9ff;
    padding:15px;
    border-radius:10px;
    margin:20px 0;
    text-align:left;
}

.task{
    background:#fafbff;
    border:2px solid #ddd;
    border-radius:10px;
    padding:15px;
    margin:15px 0;
}

.row{
    font-size:22px;
    margin:10px 0;
}

.dropzone{
    display:inline-block;
    width:80px;
    height:40px;
    border:2px dashed #4a6cf7;
    border-radius:8px;
    line-height:40px;
    font-weight:bold;
    color:#4a6cf7;
    margin-left:5px;
}

.options{
    display:flex;
    justify-content:center;
    gap:10px;
    flex-wrap:wrap;
    margin-top:10px;
}

.option{
    padding:10px 14px;
    background:#eee;
    border-radius:8px;
    cursor:grab;
    user-select:none;
    touch-action:none;
}

.option.active{
    opacity:0.6;
}

button{
    margin-top:20px;
    padding:10px 18px;
    border:none;
    border-radius:8px;
    background:#4a6cf7;
    color:white;
    cursor:pointer;
}

#result{
    margin-top:20px;
    font-size:18px;
    font-weight:bold;
}

#code{
    margin-top:10px;
    font-size:20px;
    font-weight:bold;
    color:green;
}
    .team-label{
    display:inline-block;
    margin:5px 0 12px;
    padding:8px 16px;
    background:#e8f5ee;
    border:1px solid #b8ddc5;
    border-radius:20px;
    color:#176b50;
    font-size:15px;
    font-weight:bold;
}
</style>
</head>

<body>

<div class="card">
<div class="team-label">👥 Команда 3 · 6-В класс</div>
<h2>🏛️ Станция 6: Музей закономерностей</h2>

<div class="info">
В музее перепутались числовые экспонаты.  
Восстановите закономерности и найдите правильное продолжение каждого ряда.
</div>

<!-- 1 (+0.2) -->
<div class="task" data-correct="0.7">
<div class="row">
0,1 → 0,3 → 0,5 → <span class="dropzone"></span>
</div>

<div class="options">
<div class="option" data-value="0.6">0,6</div>
<div class="option" data-value="0.7">0,7</div>
<div class="option" data-value="0.8">0,8</div>
</div>
</div>

<!-- 2 (-0.6) -->
<div class="task" data-correct="1.3">
<div class="row">
3,1 → 2,5 → 1,9 → <span class="dropzone"></span>
</div>

<div class="options">
<div class="option" data-value="1.3">1,3</div>
<div class="option" data-value="1.5">1,5</div>
<div class="option" data-value="1.1">1,1</div>
</div>
</div>

<!-- 3 (×2) -->
<div class="task" data-correct="10">
<div class="row">
1,25 → 2,5 → 5 → <span class="dropzone"></span>
</div>

<div class="options">
<div class="option" data-value="7.5">7,5</div>
<div class="option" data-value="9.5">9,5</div>
<div class="option" data-value="10">10</div>
</div>
</div>

<button onclick="check()">Проверить</button>

<div id="result"></div>
<div id="code"></div>

</div>

<script>

let dragged = null;

/* drag start */
document.querySelectorAll(".option").forEach(el => {

    el.addEventListener("pointerdown", () => {
        dragged = el;
        el.classList.add("active");
    });

});

/* move */
document.addEventListener("pointermove", (e) => {
    if(!dragged) return;

    dragged.style.position = "absolute";
    dragged.style.left = e.clientX + "px";
    dragged.style.top = e.clientY + "px";
});

/* drop */
document.addEventListener("pointerup", (e) => {

    if(!dragged) return;

    document.querySelectorAll(".dropzone").forEach(zone => {

        let rect = zone.getBoundingClientRect();

        if(
            e.clientX >= rect.left &&
            e.clientX <= rect.right &&
            e.clientY >= rect.top &&
            e.clientY <= rect.bottom
        ){
            zone.innerText = dragged.dataset.value;
            zone.dataset.value = dragged.dataset.value;
        }

    });

    dragged.style.position = "static";
    dragged.classList.remove("active");
    dragged = null;

});

/* check */
function check(){

let tasks = document.querySelectorAll(".task");
let zones = document.querySelectorAll(".dropzone");

let ok = true;

zones.forEach((z,i)=>{
    if(z.dataset.value !== tasks[i].dataset.correct){
        ok = false;
    }
});

if(ok){
    document.getElementById("result").innerText = "✔ Отлично! Все закономерности восстановлены";
    document.getElementById("code").innerText = "🔐 Код: ки";
}else{
    document.getElementById("result").innerText = "❌ Есть ошибки";
    document.getElementById("code").innerText = "";
}

}

</script>

</body>
</html>
